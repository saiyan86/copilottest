apiVersion: v1
kind: ConfigMap
metadata:
  name: abc-configmap
  namespace: deviceshifu
  labels:
    app: deviceshifu-abc
    workspace_id: "5ef15230-e84d-4320-9447-d311aa96c6a3"
    workspace_name: "test"
data:
  driverProperties: |
    driverSku: Robot Arm Controller
    driverImage: deviceshifu-robot-arm:v0.0.5
---
apiVersion: shifu.edgenesis.io/v1alpha1
kind: EdgeDevice
metadata:
  name: edgedevice-abc
  namespace: devices
  labels:
    app: deviceshifu-abc
    workspace_id: "5ef15230-e84d-4320-9447-d311aa96c6a3"
    workspace_name: "test"
  annotations:
    workspace.id: "5ef15230-e84d-4320-9447-d311aa96c6a3"
    workspace.name: "test"
    template.id: "robot-arm-v1"
spec:
  sku: "Robot Arm Controller"
  connection: Ethernet
  address: "192.168.58.2"
  protocol: RPC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deviceshifu-abc
  namespace: deviceshifu
  labels:
    app: deviceshifu-abc
    workspace_id: "5ef15230-e84d-4320-9447-d311aa96c6a3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deviceshifu-abc
  template:
    metadata:
      labels:
        app: deviceshifu-abc
        workspace_id: "5ef15230-e84d-4320-9447-d311aa96c6a3"
    spec:
      containers:
        - name: robot-arm-controller
          image: registry.test.shifu.dev/edgenesis/deviceshifu-robot-arm:v0.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NATS_SERVER
              value: "nats://1.1.1.1:1010"
            - name: JOYSTICK_TOPIC
              value: "test.abc"
            - name: EDGEDEVICE_NAME
              value: "edgedevice-abc"
            - name: EDGEDEVICE_NAMESPACE
              value: "devices"
            - name: JOG_SPEED
              value: "20"
            - name: CONTROL_LOOP_HZ
              value: "5"
          volumeMounts:
            - name: deviceshifu-config
              mountPath: "/etc/edgedevice/config"
              readOnly: true
      serviceAccountName: edgedevice-sa
      volumes:
        - name: deviceshifu-config
          configMap:
            name: abc-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: deviceshifu-abc
  namespace: deviceshifu
  labels:
    app: deviceshifu-abc
    workspace_id: "5ef15230-e84d-4320-9447-d311aa96c6a3"
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: 8080
      name: http
  selector:
    app: deviceshifu-abc
  type: ClusterIP
